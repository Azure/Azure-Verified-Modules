# Workflow for building and deploying a Hugo site to GitHub Pages
name: Hugo Build PR Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'utilities/tests/Test-ForkWorkflowSetup.ps1'
      - '.github/workflows/hugo-build-pr-check.yml'
  workflow_dispatch: {}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Default to bash
defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build PR job
  buildpr:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.136.5
      DART_SASS_VERSION: 1.108.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        shell: pwsh
        run: |
          $version = $env:DART_SASS_VERSION
          $archive = Join-Path $env:RUNNER_TEMP "dart-sass-$version-linux-x64.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/sass/dart-sass/releases/download/$version/dart-sass-$version-linux-x64.tar.gz" -OutFile $archive
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sassPath = Join-Path $env:RUNNER_TEMP 'dart-sass'
          & (Join-Path $sassPath 'sass') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sassPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test fork workflow setup instructions
        shell: pwsh
        run: ./utilities/tests/Test-ForkWorkflowSetup.ps1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --ignoreCache \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
        working-directory: ./docs
