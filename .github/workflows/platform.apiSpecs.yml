name: ".Platform: Update API Specs file"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1" # Weekly Monday Update

env:
  pipelinePrincipalGitUserName: "AVMPipelinePrincipal"
  pipelinePrincipalGitUserEmail: "AVM@noreply.github.com"
  branch_name_prefix: "update-api-specs"
  pr_title: "Update Azure API Specs List (automated)"
  pr_body:
    "This is an automated ``pull_request`` containing updates to the Azure API Specs List that is stored at ``docs/static/governance/apiSpecsList.json``.\nPlease review the ``files changed`` tab to review changes."

permissions:
      id-token: write
      contents: write
      pull-requests: write

jobs:
  job_update_api_specs_file:
    name: "Update file"
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: platform
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [Setup] task(s)
      # ---------------
      - name: "Setup agent"
        shell: pwsh
        run: |
          # Load used functions
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'pipelines' 'sharedScripts' 'Set-EnvironmentOnAgent.ps1')

          # Define PS modules to install on the runner
          $modules = @(
              @{ Name = 'Az.Accounts' },
              @{ Name = 'Az.Resources' }
          )

          # Set agent up
          Set-EnvironmentOnAgent -PSModules $modules

      - uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure local git
        run: |
          git config --global user.name '${{ env.pipelinePrincipalGitUserEmail }}'
          git config --global user.email '${{ env.pipelinePrincipalGitUserName }}'

      - name: Format branch name
        shell: pwsh
        run: |
          $rawBranch = '${{ env.branch_name_prefix }}'
          $formattedBranch = "{0}_{1}" -f $rawBranch, (Get-Date).ToString('yyyy-MM-dd-HH-mm-ss')
          Write-Verbose "Adjusting branch name [$rawBranch] to [$formattedBranch]" -Verbose
          ('{0}={1}' -f 'branch_name', $formattedBranch) | Out-File -FilePath $env:GITHUB_ENV -Encoding 'utf8' # Set full branch name (prefix + timestamp) for downstream steps

      - name: Create and checkout branch
        run: |
          BRANCH_URL="repos/${{ github.repository }}/branches"
          JQ_FILTER=".[] | select(.name == \"${{ env.branch_name }}\").name"
          CHECK_BRANCH_ORIGIN=$(gh api $BRANCH_URL | jq -r "$JQ_FILTER")
          if [ -z "$CHECK_BRANCH_ORIGIN" ]
          then
            echo "Checkout local branch (create new, no origin)..."
            git checkout -b ${{ env.branch_name }}
          else
            echo "Checkout local branch (create new, track from origin)..."
            git checkout -b ${{ env.branch_name }} --track origin/${{ env.branch_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Azure Login
        id: login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.API_SPECS_OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.API_SPECS_OIDC_TENANT_ID }}
          enable-AzPSSession: true
          allow-no-subscriptions: true

      - name: "Update file"
        shell: pwsh
        run: |
          # Load used functions
          . (Join-Path $env:GITHUB_WORKSPACE 'utilities' 'tools' 'platform' 'Set-ApiSpecsFile.ps1')

          $functionInput = @{
            SpecsFilePath          = Join-Path $env:GITHUB_WORKSPACE 'docs' 'static' 'governance' 'apiSpecsList.json'
            IncludePreview         = $true
            IncludeExternalSources = $true
          }

          Write-Verbose "Invoke task with" -Verbose
          Write-Verbose ($functionInput | ConvertTo-Json | Out-String) -Verbose

          Set-ApiSpecsFile @functionInput -Verbose

      - name: Check for changes
        id: git_status
        run: |
          mapfile -t "CHECK_GIT_STATUS" < <(git status -s)
          printf "%s\n" "${CHECK_GIT_STATUS[@]}"
          echo "changes=${#CHECK_GIT_STATUS[@]}" >> "$GITHUB_OUTPUT"

      - name: Add files, commit and push
        if: steps.git_status.outputs.changes > 0
        run: |
          echo "Pushing changes to origin..."
          git add docs/static/governance/apiSpecsList.json
          git commit -m '${{ env.pr_title }}'
          git push origin ${{ env.branch_name }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Create pull request and enable auto-merge
        id: create_pr
        if: steps.git_status.outputs.changes > 0
        run: |
          HEAD_LABEL="${{ github.repository_owner }}:${{ env.branch_name }}"
          BASE_LABEL="${{ github.repository_owner }}:$(echo '${{ github.ref }}' | sed 's:refs/heads/::')"
          PULL_REQUEST_URL="repos/${{ github.repository }}/pulls"
          JQ_FILTER=".[] | select(.head.label == \"$HEAD_LABEL\") | select(.base.label == \"$BASE_LABEL\") | .url"
          CHECK_PULL_REQUEST_URL=$(gh api $PULL_REQUEST_URL | jq -r "$JQ_FILTER")
          if [ -z "$CHECK_PULL_REQUEST_URL" ]
          then
            CHECK_PULL_REQUEST_URL=$(gh pr create \
            --title "${{ env.pr_title }}" \
            --body "${{ env.pr_body }}" \
            --base "${{ github.ref }}" \
            --head "${{ env.branch_name }}")
            echo "Created new PR: $CHECK_PULL_REQUEST_URL"

            # Auto-merge only applies to the protected 'main' branch.
            if [ "${{ github.ref }}" = "refs/heads/main" ]
            then
              echo "Enabling auto-merge for PR '$CHECK_PULL_REQUEST_URL'..."
              gh pr merge "$CHECK_PULL_REQUEST_URL" --auto --squash
            else
              echo "Base branch is not 'main' (${{ github.ref }}); skipping auto-merge (target branch has no protection rules)."
            fi
          else
            echo "Existing PR found: $CHECK_PULL_REQUEST_URL"
          fi
          echo "pr_url=$CHECK_PULL_REQUEST_URL" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Close superseded pull requests
        if: steps.git_status.outputs.changes > 0
        run: |
          # Close superseded automated PRs opened against the same target branch and delete their branches.

          # Resolve the values used to identify PRs safe to close.
          TARGET_BRANCH="$(echo '${{ github.ref }}' | sed 's:refs/heads/::')"
          CURRENT_BRANCH="${{ env.branch_name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          AUTOMATION_AUTHOR="app/${{ steps.generate-token.outputs.app-slug }}"
          PR_TITLE="${{ env.pr_title }}"
          BRANCH_PREFIX="${{ env.branch_name_prefix }}_"

          echo "Searching for superseded automated PRs targeting '$TARGET_BRANCH'..."

          # --- DEBUG: show the expected match values and every open PR on the target branch ---
          echo "::group::Debug - expected match values"
          echo "branchPrefix   = $BRANCH_PREFIX"
          echo "currentBranch  = $CURRENT_BRANCH"
          echo "repoOwner      = $REPO_OWNER"
          echo "author         = $AUTOMATION_AUTHOR"
          echo "title          = $PR_TITLE"
          echo "::endgroup::"

          echo "::group::Debug - open PRs on '$TARGET_BRANCH'"
          gh pr list --state open --base "$TARGET_BRANCH" --limit 5 \
            --json number,headRefName,headRepositoryOwner,author,title \
          | jq -r '.[] | "#\(.number)\tbranch=\(.headRefName)\towner=\(.headRepositoryOwner.login)\tauthor=\(.author.login)\ttitle=\(.title)"'
          echo "::endgroup::"

          # A PR is only considered superseded when ALL safety checks pass (see jq selects below).
          STALE_PRS="$(gh pr list --state open --base "$TARGET_BRANCH" --limit 100 \
            --json number,headRefName,headRepositoryOwner,author,title \
          | jq -r \
              --arg branchPrefix "$BRANCH_PREFIX" \
              --arg currentBranch "$CURRENT_BRANCH" \
              --arg repoOwner "$REPO_OWNER" \
              --arg author "$AUTOMATION_AUTHOR" \
              --arg title "$PR_TITLE" \
              '.[]
                | select(.headRefName | startswith($branchPrefix))         # branch uses the automation prefix
                | select(.headRefName != $currentBranch)                   # never the PR just created by this run
                | select(.headRepositoryOwner.login == $repoOwner)         # same repo, not a fork
                | select(.author.login == $author)                         # opened by this automation (app bot)
                | select(.title == $title)                                 # exact automated title
                | .number')"

          if [ -z "$STALE_PRS" ]; then
            echo "No superseded automated PRs found. Nothing to close."
            exit 0
          fi

          STALE_COUNT="$(echo "$STALE_PRS" | wc -l | tr -d ' ')"
          echo "Found $STALE_COUNT superseded automated PR(s) to close:"
          echo "$STALE_PRS" | sed 's/^/  - #/'

          echo "$STALE_PRS" | while read -r STALE_PR; do
              echo "[DRY-RUN] Would close superseded PR #$STALE_PR and delete its branch (superseded by ${{ steps.create_pr.outputs.pr_url }})."
              # gh pr close "$STALE_PR" --delete-branch --comment "Superseded by newer automated PR: ${{ steps.create_pr.outputs.pr_url }}"
            done
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
